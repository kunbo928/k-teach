schema_version: 1
id: tool-sequence
title: 工具调用时序
description: 用户、模型、Runner 与 API 的消息顺序。
kind: sequence
direction: left-to-right
nodes:
  - id: user
    label: 用户
  - id: model
    label: 模型
  - id: runner
    label: Runner
  - id: api
    label: API
edges:
  - from: user
    to: model
    label: 提问
  - from: model
    to: runner
    label: tool_use
  - from: runner
    to: api
    label: 调用
  - from: api
    to: runner
    label: result
  - from: runner
    to: model
    label: tool_result
  - from: model
    to: user
    label: 最终回复
