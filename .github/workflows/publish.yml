name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref_name != 'v0.0.1'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm Trusted Publishing support
        run: |
          npm install --global npm@latest
          npm --version
      - name: Verify release metadata
        run: node scripts/verify-release.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          npm run typecheck
          npm test
      - name: Pack and verify install
        id: pack
        run: |
          TARBALL="$(npm pack --silent)"
          test -n "$TARBALL"
          test -f "$TARBALL"
          node scripts/verify-tarball.mjs "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Reject an existing immutable version
        run: |
          if npm view "k-teach@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "k-teach@${GITHUB_REF_NAME#v} already exists" >&2
            exit 1
          fi
      - name: Publish verified tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public
