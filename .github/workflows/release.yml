name: Changesets release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test
      - name: Create release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: release package"
          title: "chore: release package"
          # Releases are created by .github/workflows/github-release.yml on tag push,
          # so the changesets action must not also create GitHub Releases.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish prepared package
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          pnpm release || echo "npm publish skipped or failed; continuing to tag the release"
          TAG="k-teach@$(node -p "require('./package.json').version")"
          git tag -f "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
