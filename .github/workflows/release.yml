name: Changesets release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test
      - name: Create release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore: release package"
          title: "chore: release package"
          # Releases are created below (and by .github/workflows/github-release.yml
          # on manual/user tag pushes), so the changesets action must not also
          # create GitHub Releases.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish prepared package
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release
      - name: Push release tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push --follow-tags
      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## / {
              if (capture) exit
              if ($0 == "## " ver) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            {
              echo "## Changes"
              echo ""
              echo "_No CHANGELOG.md entry was found for this version._"
            } > release_body.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --title "v${VERSION}" --notes-file release_body.md
          fi
